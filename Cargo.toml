[workspace]
members = [
    ".",
    "src/users/database/migration",
    "src/features/database/migration",
]

[package]
name = "central-server"
version = "1.0.0"
edition = "2024"

[profile.release]
lto = "thin"
codegen-units = 1
# debug = true

[dependencies]
users_migration = { path = "src/users/database/migration" }
features_migration = { path = "src/features/database/migration" }

sea-orm-migration = { version = "2.0.4" }
dashmap = { version = "6.2.1", features = ["inline", "raw-api"] }
futures-util = "0.3.34"
heapless = { version = "0.9.3", features = ["serde"] }
hex = "0.4.3"
parking_lot = { version = "0.13.0", features = ["send_guard"] }
rand = "0.10.3"
server-shared = { git = "https://github.com/GlobedGD/server-shared", rev = "v6", features = [
    "main",
    "srvc",
    "dyn-encoding",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slab = "0.4.12"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
arc-swap = "1.9.3"
rustc-hash = "2.1.3"
sea-orm = { version = "2.0.4", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
] }
rustls = { version = "0.23.46", features = ["ring"] }
itertools = "0.15.0"
bcrypt = "0.19.3"
smallvec = "1.16.4"
nohash-hasher = "0.2.0"
crypto_secretbox = { version = "0.1.1", features = ["heapless"] }
time-format = "1.2.4"
anyhow = "1.0.104"
build-time = "0.1.3"
validator = { version = "0.21.0", features = ["derive"] }
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "http2",
    "json",
    "rustls",
    "form",
] }

# Featured levels
google-sheets4 = { version = "7.0.0", optional = true, default-features = false, features = [
    "yup-oauth2",
] }
yup-oauth2 = { version = "12", features = [
    "hyper-rustls",
    "aws-lc-rs",
], optional = true }

# Word filter
aho-corasick = { version = "1.1.5", optional = true }
fuzzy-matcher = { version = "0.3.7", optional = true }

# Discord
poise = { version = "0.7.1", optional = true }
plotters = { version = "0.3", optional = true, default-features = false, features = [
    "bitmap_backend",
    "ab_glyph",
    "all_series",
] }
metrics-process = { version = "2.4.3", optional = true }
image = { version = "0.25.10", optional = true }

# Analytics
clickhouse = { version = "0.15.3", features = [
    "rustls-tls",
    "rustls-tls-ring",
    "rustls-tls-native-roots",
    "chrono",
    "zstd",
], optional = true }
include_dir = { version = "0.7.4", optional = true }
chrono = { version = "0.4.45", optional = true }

# Web
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.7.1", features = ["cors"], optional = true }

# Mimalloc
mimalloc = { version = "0.1.52", optional = true }

[features]
all = [
    "discord",
    "quic",
    "websocket",
    "featured-levels",
    "word-filter",
    "analytics",
    "web",
]
docker-build = ["all"]
docker-alpine-build = ["all", "mimalloc"]

word-filter = ["dep:aho-corasick"]
featured-levels = ["dep:google-sheets4", "dep:yup-oauth2"]
default = []
discord = [
    "dep:poise",
    "dep:plotters",
    "dep:image",
    "dep:fuzzy-matcher",
    "dep:metrics-process",
]
quic = ["server-shared/quic"]
websocket = ["server-shared/websocket"]
mimalloc = ["dep:mimalloc"]
analytics = ["dep:clickhouse", "dep:include_dir", "dep:chrono"]
web = ["dep:axum", "dep:tower-http"]
